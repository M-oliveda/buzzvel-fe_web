name: Deploy preview

# Reusable, called by ci.yml after `CI passed` on a pull request into `develop`. Deploys
# buzzvel-fe-pr-<n> behind the NGINX gate and comments its URL on the pull request
# (MASTERPLAN §9). Pull requests from forks never get here: they receive no secrets.
# cleanup-preview.yml deletes the service when the pull request closes.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-push-deploy.yml
    with:
      environment: preview
      service: buzzvel-fe-pr-${{ github.event.pull_request.number }}
      gated: true
      min_instances: 0
      max_instances: 1
    secrets: inherit

  comment:
    name: Comment the preview URL
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # One comment per pull request, updated on every push.
      - uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- buzzvel-fe-preview -->";
            const body = [
              marker,
              `**Preview:** ${process.env.PREVIEW_URL}`,
              "",
              `Commit \`${context.sha.slice(0, 7)}\`. Basic auth: the \`preview\` environment credentials.`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
