name: Deploy production

# Reusable, called by ci.yml after `CI passed` on a push to `main`, i.e. when a release (or
# hotfix) pull request merges. Rebuilds the commit in the production project, deploys it without
# the gate and, only once the smoke test passes, tags it `v<package.json version>` and publishes
# the GitHub Release. A tag therefore always marks a stable production release (MASTERPLAN §9,
# owner decision 2026-11-19).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    name: Check the release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # Fails before anything is deployed when the version was not bumped for this release.
      - name: Read version and check the tag is new
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version '${version}' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "::error::${tag} already exists: bump the version in package.json on the release branch"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag}"

  deploy:
    name: Deploy
    needs: version
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-push-deploy.yml
    with:
      environment: production
      service: buzzvel-fe-prod
      gated: false
      # 1 during the evaluation window (Nov 20 to Dec 4, MASTERPLAN §9), then reviewed for cost.
      min_instances: 1
      max_instances: 3
      site_url: https://buzzvel-fe.moliveda.dev
    secrets: inherit

  release:
    name: Tag and publish the release
    needs: [version, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The custom domain depends on DNS and a managed certificate outside this pipeline, so it
      # is reported but does not block the release; the run.app URL was smoke-tested above.
      - name: Check the custom domain
        run: |
          if curl --fail --silent --show-error --max-time 15 https://buzzvel-fe.moliveda.dev/health; then
            echo
          else
            echo "::warning::https://buzzvel-fe.moliveda.dev is not serving yet (DNS or certificate)"
          fi

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes --latest
